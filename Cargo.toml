[workspace]
resolver = "2"
members = ["crates/bili-core", "crates/bili-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yungumax/BILIdown"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
# 弹幕接口给的是 raw deflate，得自己解（reqwest 的 deflate 特性认的是 zlib 头）
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
md-5 = "0.10"
hex = "0.4"
regex = "1"
url = "2"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
